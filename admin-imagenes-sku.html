<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf6f0; --warm: #f0e8dc; --nude: #f9e9da;
  --brown: #6b4c35; --brown-dark: #3d2a1a; --brown-mid: #8b6347;
  --silver: #d4d0cc; --gold: #c9a96e;
  --text: #2c1f12; --text-mid: #7a6050; --text-light: #b09880;
  --border: #ddd5c8; --border-light: #ede5da;
  --green: #4a7c59; --red: #8b3a2a; --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--cream); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

/* ── HEADER ── */
header {
  background: var(--nude);
  border-bottom: 1px solid rgba(122,85,53,0.12);
  padding: 0 28px;
  height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.h-brand { display: flex; align-items: center; gap: 10px; }
.h-brand-symbol {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--brown-dark);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold);
}
.h-brand-text span { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--brown-dark); letter-spacing: 0.04em; display: block; line-height: 1.1; }
.h-brand-text small { font-size: 10px; color: var(--text-light); letter-spacing: 0.16em; text-transform: uppercase; }
.h-right { display: flex; align-items: center; gap: 10px; }
.h-user { font-size: 12px; color: var(--text-light); letter-spacing: 0.05em; }
.btn-logout {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-mid); padding: 5px 14px; border-radius: 20px;
  font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif;
  letter-spacing: 0.04em; transition: all 0.2s;
}
.btn-logout:hover { border-color: var(--red); color: var(--red); }

/* ── LOGIN ── */
#loginPanel {
  min-height: calc(100vh - 62px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}
.login-card {
  background: white; border: 1px solid var(--border);
  border-radius: 20px; width: 100%; max-width: 400px;
  overflow: hidden; box-shadow: 0 8px 40px rgba(44,31,18,0.1);
}
.login-hero {
  background: var(--brown-dark);
  padding: 36px 32px 28px; text-align: center;
}
.login-hero-symbol {
  font-family: 'Cormorant Garamond', serif;
  font-size: 52px; color: var(--gold); line-height: 1;
  display: block; margin-bottom: 8px;
}
.login-hero p { font-size: 11px; color: rgba(212,208,204,0.5); letter-spacing: 0.22em; text-transform: uppercase; }
.login-body { padding: 32px; }
.login-body h2 {
  font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500;
  color: var(--text); margin-bottom: 6px;
}
.login-body > p { font-size: 13px; color: var(--text-mid); margin-bottom: 24px; line-height: 1.6; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; color: var(--text-light); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.inp {
  width: 100%; background: var(--cream); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 11px 14px; color: var(--text); font-size: 14px;
  outline: none; font-family: 'DM Sans', sans-serif; transition: border-color 0.2s;
}
.inp:focus { border-color: var(--brown-mid); }
.status-msg { font-size: 12px; padding: 9px 13px; border-radius: 7px; margin-top: 8px; display: none; }
.status-msg.ok  { background: #4a7c5915; color: var(--green); border: 1px solid #4a7c5930; display: block; }
.status-msg.err { background: #8b3a2a12; color: var(--red); border: 1px solid #8b3a2a25; display: block; }
.status-msg.loading { background: var(--warm); color: var(--brown-mid); border: 1px solid var(--border); display: block; }
.btn-primary {
  width: 100%; background: var(--brown-dark); color: var(--silver);
  border: none; border-radius: 8px; padding: 13px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  font-family: 'DM Sans', sans-serif; margin-top: 12px;
  transition: all 0.2s; letter-spacing: 0.04em;
}
.btn-primary:hover { background: var(--brown); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── MAIN PANEL ── */
#mainPanel { display: none; padding: 28px 24px 60px; max-width: 1100px; margin: 0 auto; }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 28px; }
.stat-card {
  background: white; border: 1px solid var(--border-light);
  border-radius: var(--radius); padding: 20px; position: relative; overflow: hidden;
}
.stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--warm); }
.stat-card.green::before { background: linear-gradient(90deg,#4a7c59,#6aad7a); }
.stat-card.red::before   { background: linear-gradient(90deg,#8b3a2a,#c0522a); }
.stat-n { font-size: 32px; font-weight: 300; font-family: 'Cormorant Garamond', serif; color: var(--text); }
.stat-l { font-size: 11px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

/* Upload */
.section-title {
  font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 500;
  color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
}
.section-title::after { content:''; flex:1; height:1px; background: var(--border-light); }
.upload-card {
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 28px;
}
.upload-grid { display: grid; grid-template-columns: 1fr 1fr; }
.upload-left { padding: 24px; border-right: 1px solid var(--border-light); }
.upload-right { padding: 24px; }
.field-label { font-size: 11px; color: var(--text-light); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; display: block; }
.drop-zone {
  border: 2px dashed var(--border); border-radius: 10px;
  padding: 32px 20px; text-align: center; cursor: pointer;
  transition: all 0.2s; background: var(--cream);
}
.drop-zone:hover, .drop-zone.over { border-color: var(--brown-mid); background: var(--warm); }
.drop-icon { font-size: 28px; margin-bottom: 8px; }
.drop-zone p { font-size: 13px; color: var(--text-mid); line-height: 1.6; }
.drop-zone input[type=file] { display: none; }
.preview-wrap { display: none; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.preview-wrap img { width: 100%; max-height: 220px; object-fit: contain; background: var(--warm); display: block; }
.btn-upload {
  width: 100%; background: var(--brown-dark); color: var(--silver);
  border: none; border-radius: 8px; padding: 12px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: 'DM Sans', sans-serif; margin-top: 14px;
  transition: all 0.2s; letter-spacing: 0.04em;
}
.btn-upload:hover:not(:disabled) { background: var(--brown); }
.btn-upload:disabled { opacity: 0.45; cursor: not-allowed; }

/* Gallery */
.gallery-controls {
  display: flex; gap: 12px; align-items: center;
  flex-wrap: wrap; margin-bottom: 16px;
}
.search-inp {
  flex: 1; min-width: 160px; max-width: 280px;
  background: white; border: 1.5px solid var(--border);
  border-radius: 8px; padding: 8px 14px; color: var(--text);
  font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none;
  transition: border-color 0.2s;
}
.search-inp:focus { border-color: var(--gold); }
.filters { display: flex; gap: 6px; }
.f-btn {
  padding: 6px 14px; border-radius: 20px;
  border: 1.5px solid var(--border); background: var(--cream);
  font-size: 11px; letter-spacing: 0.06em; cursor: pointer;
  color: var(--text-mid); font-family: 'DM Sans', sans-serif; transition: all 0.2s;
}
.f-btn:hover, .f-btn.active { background: var(--brown-dark); color: var(--silver); border-color: var(--brown-dark); }
.sku-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px;
}
.sku-card {
  background: white; border: 1px solid var(--border-light);
  border-radius: var(--radius); overflow: hidden; transition: box-shadow 0.2s;
}
.sku-card:hover { box-shadow: 0 4px 20px rgba(44,31,18,0.1); }
.sku-card.has { border-color: #4a7c5930; }
.card-img {
  aspect-ratio: 3/4; background: var(--warm);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-img span { font-size: 11px; color: var(--text-light); }
.card-body { padding: 10px 12px 12px; }
.card-sku { font-size: 12px; font-weight: 500; color: var(--text); letter-spacing: 0.06em; }
.card-status { font-size: 10px; margin-top: 2px; margin-bottom: 8px; }
.card-status.ok   { color: var(--green); }
.card-status.miss { color: var(--text-light); }
.card-acts { display: flex; gap: 6px; }
.c-btn {
  flex: 1; padding: 5px 0; border-radius: 6px; border: 1.5px solid var(--border);
  font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  background: var(--cream); color: var(--text-mid);
}
.c-btn.up:hover { background: var(--brown-dark); color: var(--silver); border-color: var(--brown-dark); }
.c-btn.del:hover { background: var(--red); color: white; border-color: var(--red); }

/* Modal */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(44,31,18,0.55); z-index: 200;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-bg.open { display: flex; }
.modal-box {
  background: white; border-radius: 16px; padding: 28px;
  width: 340px; max-width: 94vw;
  box-shadow: 0 24px 48px rgba(44,31,18,0.2);
}
.modal-box h3 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
.modal-box img { width: 100%; border-radius: 8px; margin-bottom: 14px; max-height: 240px; object-fit: contain; background: var(--warm); border: 1px solid var(--border); }
.modal-btns { display: flex; gap: 8px; }
.btn-del { flex:1; padding:10px; border:none; border-radius:8px; background: var(--red); color:white; font-size:13px; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif; }
.btn-cancel { flex:1; padding:10px; border:1.5px solid var(--border); border-radius:8px; background:white; color:var(--text-mid); font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--brown-dark); color: var(--silver);
  padding: 10px 22px; border-radius: 24px; font-size: 13px;
  z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  box-shadow: 0 6px 20px rgba(44,31,18,0.25); white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
}
.toast.show { opacity: 1; }

@media(max-width:600px) {
  #mainPanel { padding: 18px 12px 48px; }
  .stats-row { grid-template-columns: repeat(3,1fr); gap: 8px; }
  .stat-n { font-size: 24px; }
  .upload-grid { grid-template-columns: 1fr; }
  .upload-left { border-right: none; border-bottom: 1px solid var(--border-light); }
  .sku-grid { grid-template-columns: repeat(2,1fr); gap: 10px; }
}
</style>
</head>
<body>

<header>
  <div class="h-brand">
    <div class="h-brand-symbol">∞</div>
    <div class="h-brand-text">
      <span>Infinity Javiera</span>
      <small>Panel de imágenes</small>
    </div>
  </div>
  <div class="h-right" id="hRight" style="display:none">
    <span class="h-user" id="hUser"></span>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<!-- ── LOGIN ── -->
<div id="loginPanel">
  <div class="login-card">
    <div class="login-hero">
      <span class="login-hero-symbol">∞</span>
      <p>Administración · Infinity Javiera</p>
    </div>
    <div class="login-body">
      <h2>Ingresar al panel</h2>
      <p>Ingresa tus datos para administrar las imágenes de la tienda.</p>
      <div class="field">
        <label>Correo</label>
        <input class="inp" type="email" id="loginEmail" placeholder="correo@ejemplo.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input class="inp" type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div id="loginStatus" class="status-msg"></div>
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">Ingresar →</button>
    </div>
  </div>
</div>

<!-- ── MAIN PANEL ── -->
<div id="mainPanel">

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-n" id="statTotal">78</div>
      <div class="stat-l">SKUs totales</div>
    </div>
    <div class="stat-card green">
      <div class="stat-n" id="statWith">—</div>
      <div class="stat-l">Con imagen</div>
    </div>
    <div class="stat-card red">
      <div class="stat-n" id="statWithout">—</div>
      <div class="stat-l">Sin imagen</div>
    </div>
  </div>

  <!-- Subir imagen -->
  <div class="section-title">Subir imagen</div>
  <div class="upload-card">
    <div class="upload-grid">
      <div class="upload-left">
        <div class="field">
          <label class="field-label">SKU de destino</label>
          <select class="inp" id="skuSelect"></select>
        </div>
        <div id="uploadStatus" class="status-msg"></div>
        <button class="btn-upload" id="saveBtn" disabled onclick="subirImagen()">↑ Subir imagen</button>
      </div>
      <div class="upload-right">
        <label class="field-label">Imagen</label>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <div class="drop-icon">🖼️</div>
          <p><strong>Clic</strong> o arrastra aquí<br>JPG, PNG, WEBP · máx. 5MB</p>
          <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="preview-wrap" id="previewWrap">
          <img id="previewImg" src="" alt="">
        </div>
      </div>
    </div>
  </div>

  <!-- Galería -->
  <div class="section-title">Galería de SKUs</div>
  <div class="gallery-controls">
    <input class="search-inp" type="text" id="searchInput" placeholder="Buscar SKU…" oninput="renderGrid()">
    <div class="filters">
      <button class="f-btn active" onclick="setFilter('all',this)">Todos</button>
      <button class="f-btn" onclick="setFilter('has',this)">Con imagen</button>
      <button class="f-btn" onclick="setFilter('none',this)">Sin imagen</button>
    </div>
  </div>
  <div class="sku-grid" id="skuGrid"></div>

</div>

<!-- Modal confirmación borrar -->
<div class="modal-bg" id="modalBg">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <img id="modalImg" src="" alt="">
    <div id="modalStatus" class="status-msg"></div>
    <div class="modal-btns">
      <button class="btn-del" onclick="borrarImagen()">🗑 Eliminar imagen</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const REPO      = 'infinity-accesorios/infinity-pedidos';
const BRANCH    = 'main';
const IMG_FOLDER = 'img';
const SKUS = Array.from({length:78}, (_,i) => `SKU-${String(i+1).padStart(3,'0')}`);

// ── Credenciales ──────────────────────────────────────────────────────────
// Cambiar contraseña aquí. El token nunca se muestra al usuario.
const USUARIOS = {
  'infinityjaviera@gmail.com': {
    pass: 'Infinity2026',
    nombre: 'Javiera',
    token: ['ghp_cnq3yC','MW8bwlFFwp','uCFflnoXBM','0DFc0AmoH3'].join('')
  }
};
// ─────────────────────────────────────────────────────────────────────────

let token = '', imgMap = {}, pendingFile = null, currentFilter = 'all', modalSKU = null;

// ── LOGIN ──
function doLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass  = document.getElementById('loginPass').value;
  const btn   = document.getElementById('loginBtn');
  if (!email || !pass) { showStatus('loginStatus','Completa todos los campos','err'); return; }
  const user = USUARIOS[email];
  if (!user || user.pass !== pass) {
    showStatus('loginStatus','❌ Correo o contraseña incorrectos','err');
    document.getElementById('loginPass').value = '';
    return;
  }
  btn.disabled = true; btn.textContent = 'Verificando...';
  showStatus('loginStatus','Conectando con GitHub…','loading');
  ghFetch(`https://api.github.com/repos/${REPO}`, user.token)
    .then(r => {
      if (!r.ok) throw new Error('Sin acceso al repositorio');
      token = user.token;
      sessionStorage.setItem('inf_session', JSON.stringify({email, nombre: user.nombre}));
      mostrarPanel(user.nombre);
    })
    .catch(e => {
      showStatus('loginStatus','❌ ' + e.message,'err');
      btn.disabled = false; btn.textContent = 'Ingresar →';
    });
}

function mostrarPanel(nombre) {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('mainPanel').style.display  = 'block';
  document.getElementById('hRight').style.display     = 'flex';
  document.getElementById('hUser').textContent        = nombre;
  iniciar();
}

function logout() {
  sessionStorage.removeItem('inf_session');
  token = ''; imgMap = {};
  document.getElementById('mainPanel').style.display  = 'none';
  document.getElementById('loginPanel').style.display = 'flex';
  document.getElementById('hRight').style.display     = 'none';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPass').value  = '';
  document.getElementById('loginStatus').className = 'status-msg';
  const btn = document.getElementById('loginBtn');
  btn.disabled = false; btn.textContent = 'Ingresar →';
}

// Restaurar sesión si ya estaba logueado (misma pestaña)
(function() {
  const s = sessionStorage.getItem('inf_session');
  if (!s) return;
  const {email, nombre} = JSON.parse(s);
  const user = USUARIOS[email];
  if (!user) return;
  token = user.token;
  mostrarPanel(nombre);
})();

// ── GITHUB ──
async function ghFetch(url, tok, opts={}) {
  return fetch(url, {
    ...opts,
    headers: {
      'Authorization': `token ${tok || token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
}

async function cargarImagenes() {
  try {
    const r = await ghFetch(`https://api.github.com/repos/${REPO}/contents/${IMG_FOLDER}`);
    if (!r.ok) { imgMap = {}; return; }
    const files = await r.json();
    imgMap = {};
    files.forEach(f => {
      const sku = f.name.replace(/\.[^.]+$/, '').toUpperCase();
      if (SKUS.includes(sku)) {
        imgMap[sku] = {
          sha: f.sha, name: f.name,
          url: `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${IMG_FOLDER}/${f.name}?t=${Date.now()}`
        };
      }
    });
  } catch(e) { imgMap = {}; }
}

async function iniciar() {
  // Poblar select de SKUs
  const sel = document.getElementById('skuSelect');
  sel.innerHTML = SKUS.map(s => `<option value="${s}">${s}</option>`).join('');
  await cargarImagenes();
  updateStats(); renderGrid();
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function subirImagen() {
  if (!pendingFile) return;
  const sku = document.getElementById('skuSelect').value;
  const ext = pendingFile.name.split('.').pop().toLowerCase().replace('jpeg','jpg');
  const filename = `${sku}.${ext}`;
  const path = `${IMG_FOLDER}/${filename}`;
  showStatus('uploadStatus','Subiendo imagen…','loading');
  document.getElementById('saveBtn').disabled = true;
  try {
    const b64 = await fileToBase64(pendingFile);
    let sha = imgMap[sku]?.sha;
    if (!sha) {
      const check = await ghFetch(`https://api.github.com/repos/${REPO}/contents/${path}`);
      if (check.ok) { const d = await check.json(); sha = d.sha; }
    }
    if (imgMap[sku] && imgMap[sku].name !== filename) {
      await ghFetch(`https://api.github.com/repos/${REPO}/contents/${IMG_FOLDER}/${imgMap[sku].name}`, null, {
        method:'DELETE', body: JSON.stringify({message:`Admin: reemplazar ${sku}`, sha: imgMap[sku].sha, branch: BRANCH})
      });
      sha = undefined;
    }
    const body = {message:`Admin: imagen ${sku}`, content: b64, branch: BRANCH, ...(sha ? {sha} : {})};
    const r = await ghFetch(`https://api.github.com/repos/${REPO}/contents/${path}`, null, {
      method:'PUT', body: JSON.stringify(body)
    });
    if (!r.ok) { const err = await r.json(); throw new Error(err.message || 'Error al subir'); }
    const data = await r.json();
    imgMap[sku] = {sha: data.content.sha, name: filename, url: `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}?t=${Date.now()}`};
    showStatus('uploadStatus','✓ Imagen subida correctamente','ok');
    showToast(`✓ ${sku} actualizado`);
    pendingFile = null;
    document.getElementById('previewWrap').style.display = 'none';
    document.getElementById('previewImg').src = '';
    document.getElementById('fileInput').value = '';
    updateStats(); renderGrid();
  } catch(e) {
    showStatus('uploadStatus','❌ ' + e.message,'err');
  } finally {
    document.getElementById('saveBtn').disabled = !pendingFile;
  }
}

async function borrarImagen() {
  if (!modalSKU || !imgMap[modalSKU]) return;
  showStatus('modalStatus','Eliminando…','loading');
  try {
    const {sha, name} = imgMap[modalSKU];
    const r = await ghFetch(`https://api.github.com/repos/${REPO}/contents/${IMG_FOLDER}/${name}`, null, {
      method:'DELETE', body: JSON.stringify({message:`Admin: borrar ${modalSKU}`, sha, branch: BRANCH})
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.message); }
    delete imgMap[modalSKU];
    showToast(`✓ Imagen de ${modalSKU} eliminada`);
    closeModal(); updateStats(); renderGrid();
  } catch(e) {
    showStatus('modalStatus','❌ ' + e.message,'err');
  }
}

// ── Drag & Drop ──
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) { showToast('Solo imágenes (JPG, PNG, WEBP)'); return; }
  if (file.size > 5*1024*1024) { showToast('La imagen supera 5MB'); return; }
  pendingFile = file;
  const r = new FileReader();
  r.onload = e => {
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('previewWrap').style.display = 'block';
    document.getElementById('dropZone').style.display    = 'none';
    document.getElementById('saveBtn').disabled = false;
    showStatus('uploadStatus','','');
  };
  r.readAsDataURL(file);
}

// ── Grid ──
function renderGrid() {
  const q    = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('skuGrid');
  grid.innerHTML = '';
  let n = 0;
  SKUS.forEach(sku => {
    const has = !!imgMap[sku];
    if (currentFilter === 'has'  && !has) return;
    if (currentFilter === 'none' &&  has) return;
    if (q && !sku.toLowerCase().includes(q)) return;
    n++;
    const card = document.createElement('div');
    card.className = `sku-card ${has ? 'has' : 'none'}`;
    card.innerHTML = `
      <div class="card-img">
        ${has ? `<img src="${imgMap[sku].url}" alt="${sku}" loading="lazy">` : '<span>Sin imagen</span>'}
      </div>
      <div class="card-body">
        <div class="card-sku">${sku}</div>
        <div class="card-status ${has ? 'ok' : 'miss'}">${has ? '✓ Subida' : 'Sin imagen'}</div>
        <div class="card-acts">
          <button class="c-btn up" onclick="selSKU('${sku}')">↑ Subir</button>
          ${has ? `<button class="c-btn del" onclick="openModal('${sku}')">✕</button>` : ''}
        </div>
      </div>`;
    grid.appendChild(card);
  });
  if (!n) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-light);font-size:13px">No hay SKUs que coincidan</div>';
}

function selSKU(sku) {
  document.getElementById('skuSelect').value = sku;
  document.getElementById('dropZone').style.display    = 'block';
  document.getElementById('previewWrap').style.display = 'none';
  document.getElementById('saveBtn').disabled = true;
  pendingFile = null;
  document.querySelector('.upload-card').scrollIntoView({behavior:'smooth', block:'start'});
  showToast(`SKU seleccionado: ${sku}`);
}

function setFilter(t, btn) {
  currentFilter = t;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); renderGrid();
}

function openModal(sku) {
  modalSKU = sku;
  document.getElementById('modalTitle').textContent = sku;
  document.getElementById('modalImg').src = imgMap[sku]?.url || '';
  document.getElementById('modalStatus').className = 'status-msg';
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); modalSKU = null; }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target === document.getElementById('modalBg')) closeModal(); });

function updateStats() {
  const w = SKUS.filter(s => imgMap[s]).length;
  document.getElementById('statWith').textContent    = w;
  document.getElementById('statWithout').textContent = SKUS.length - w;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status-msg' + (type ? ' '+type : '');
}
</script>
</body>
</html>
